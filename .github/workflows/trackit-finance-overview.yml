name: TrackIt Finance Overview Enhancements

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  enhance:
    if: github.event.head_commit.message != 'Add daily income and shift overview'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Add dashboard overview elements and statistics
        run: |
          python - <<'PY'
          from pathlib import Path

          index = Path('index.html')
          html = index.read_text()

          net_marker = '''                    <div class="net-summary">\n\n                        <span>\n                            This month's net\n                        </span>\n\n                        <strong id="monthNet">\n                            ₹0\n                        </strong>\n\n                    </div>'''
          net_add = net_marker + '''\n\n\n                    <div class="net-summary today-net-summary">\n\n                        <span>\n                            Today's net\n                        </span>\n\n                        <strong id="todayNet">\n                            ₹0\n                        </strong>\n\n                    </div>'''
          if 'id="todayNet"' not in html and net_marker in html:
              html = html.replace(net_marker, net_add, 1)

          shift_marker = '''                <!-- =================================================\n                     SELF TRANSFER\n                     ================================================= -->'''
          shift_section = '''                <!-- =================================================\n                     SHIFT OVERVIEW\n                     ================================================= -->\n\n                <section class="quick-add-section shift-overview-section">\n                    <div class="section-heading">\n                        <h2>Shift overview</h2>\n                        <p>Your current account position</p>\n                    </div>\n\n                    <div class="shift-overview-grid">\n                        <article class="shift-overview-card">\n                            <span>Cash balance</span>\n                            <strong id="shiftCashBalance">₹0</strong>\n                        </article>\n                        <article class="shift-overview-card">\n                            <span>Bank balance</span>\n                            <strong id="shiftBankBalance">₹0</strong>\n                        </article>\n                        <article class="shift-overview-card">\n                            <span>Today's transfers</span>\n                            <strong id="shiftTodayTransfers">₹0</strong>\n                        </article>\n                    </div>\n                </section>\n\n\n\n''' + shift_marker
          if 'id="shiftCashBalance"' not in html and shift_marker in html:
              html = html.replace(shift_marker, shift_section, 1)

          index.write_text(html)

          script = Path('script.js')
          js = script.read_text()

          enhancement = r'''\n\n/* =========================================================\n   TRACKIT — DAILY INCOME / NET / SHIFT OVERVIEW\n   ========================================================= */\n\nfunction trackitOverviewEnhancements() {\n    if (typeof data === "undefined") return;\n\n    const transactions = Array.isArray(data.transactions) ? data.transactions : [];\n    const today = typeof todayISO === "function" ? todayISO() : new Date().toISOString().slice(0, 10);\n    const currentMonth = today.slice(0, 7);\n\n    const amountOf = (t) => Number(t.amount ?? t.value ?? 0) || 0;\n    const typeOf = (t) => String(t.type ?? t.kind ?? "").toLowerCase();\n    const dateOf = (t) => String(t.date ?? t.createdAt ?? "").slice(0, 10);\n    const isIncome = (t) => typeOf(t) === "income";\n    const isExpense = (t) => typeOf(t) === "expense";\n    const isTransfer = (t) => ["transfer", "self-transfer", "self_transfer"].includes(typeOf(t));\n\n    const todayIncome = transactions.filter(t => dateOf(t) === today && isIncome(t)).reduce((s, t) => s + amountOf(t), 0);\n    const todayExpense = transactions.filter(t => dateOf(t) === today && isExpense(t)).reduce((s, t) => s + amountOf(t), 0);\n    const monthIncome = transactions.filter(t => dateOf(t).slice(0, 7) === currentMonth && isIncome(t)).reduce((s, t) => s + amountOf(t), 0);\n    const averageDailyIncome = monthIncome / Math.max(1, new Date().getDate());\n\n    const setMoney = (id, value) => {\n        const el = document.getElementById(id);\n        if (el && typeof money === "function") el.textContent = money(value);\n    };\n\n    setMoney("todayNet", todayIncome - todayExpense);\n\n    const cashAccounts = Array.isArray(data.settings?.cashAccounts) ? data.settings.cashAccounts : [];\n    const bankAccounts = Array.isArray(data.settings?.bankAccounts) ? data.settings.bankAccounts : [];\n    const cashBalance = cashAccounts.reduce((s, a) => s + (Number(a.balance) || 0), 0);\n    const bankBalance = bankAccounts.reduce((s, a) => s + (Number(a.balance) || 0), 0);\n    const todayTransfers = transactions.filter(t => dateOf(t) === today && isTransfer(t)).reduce((s, t) => s + amountOf(t), 0);\n\n    setMoney("shiftCashBalance", cashBalance);\n    setMoney("shiftBankBalance", bankBalance);\n    setMoney("shiftTodayTransfers", todayTransfers);\n\n    const statsPage = document.getElementById("statisticsPage");\n    if (statsPage) {\n        let card = document.getElementById("averageDailyIncomeCard");\n        if (!card) {\n            card = document.createElement("article");\n            card.id = "averageDailyIncomeCard";\n            card.className = "stat-card average-daily-income-card";\n            card.innerHTML = '<span class="stat-label">Average daily income</span><strong id="averageDailyIncomeValue">₹0</strong><span class="stat-note">This month so far</span>';\n            const grid = statsPage.querySelector(".statistics-grid, .stats-grid");\n            (grid || statsPage).appendChild(card);\n        }\n        setMoney("averageDailyIncomeValue", averageDailyIncome);\n    }\n}\n\ntrackitOverviewEnhancements();\nsetInterval(trackitOverviewEnhancements, 1000);\n'''

          if 'averageDailyIncomeValue' not in js:
              js += enhancement
              script.write_text(js)
          PY

      - name: Add styling for new overview elements
        run: |
          cat >> style.css <<'CSS'

/* TrackIt finance overview additions */
.today-net-summary { margin-top: 10px; }
.shift-overview-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; }
.shift-overview-card { min-width: 0; padding: 16px; border-radius: 18px; background: rgba(255,255,255,.72); border: 1px solid rgba(70,55,120,.10); box-shadow: 0 6px 20px rgba(35,25,70,.05); }
.shift-overview-card span { display: block; font-size: 12px; opacity: .65; margin-bottom: 7px; }
.shift-overview-card strong { display: block; font-size: 18px; letter-spacing: -.02em; }
@media (max-width: 640px) { .shift-overview-grid { grid-template-columns: 1fr; } }
CSS

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html script.js style.css
          git commit -m "Add daily income and shift overview"
          git push

name: TrackIt Settings Repair

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Repair settings defaults, controls and toggles
        run: |
          python - <<'PY'
          from pathlib import Path

          js = Path('script.js')
          text = js.read_text()

          # Remove the old built-in category defaults from the source itself.
          import re
          text = re.sub(r'expenseCategories:\s*\[[\s\S]*?\],\n\n\s*incomeCategories:', 'expenseCategories: [],\n\n        incomeCategories:', text, count=1)
          text = re.sub(r'incomeCategories:\s*\[[\s\S]*?\],\n\n\s*cashAccounts:', 'incomeCategories: [],\n\n        cashAccounts:', text, count=1)

          repair = r'''

/* =========================================================
   SETTINGS REPAIR
   Robust mobile-friendly settings interactions.
   ========================================================= */

(function () {
    function initSettingsRepair() {
        const settingsPage = document.getElementById("settingsPage");
        if (!settingsPage || settingsPage.dataset.repaired === "true") return;
        settingsPage.dataset.repaired = "true";

        // Keep every settings toggle aligned and tappable.
        settingsPage.querySelectorAll('input[type="checkbox"]').forEach(input => {
            input.classList.add("trackit-toggle-input");
            const wrapper = input.closest("label, .toggle, .switch, .setting-row, .setting-item");
            if (wrapper) wrapper.classList.add("trackit-toggle-row");
        });

        // Delegate clicks so dynamically rendered settings controls continue to work.
        settingsPage.addEventListener("click", event => {
            const button = event.target.closest("button");
            if (!button) return;

            const label = (button.textContent || "").replace(/\s+/g, " ").trim().toLowerCase();
            const id = (button.id || "").toLowerCase();
            const action = (button.dataset.action || "").toLowerCase();

            // If an existing handler is present, do not interfere with it.
            if (button.dataset.settingsRepairHandled === "true") return;

            // Make common Add controls trigger the existing modal/open functions when available.
            const candidates = [];
            if (label.includes("expense") && label.includes("categor")) candidates.push("openAddExpenseCategory", "openExpenseCategoryModal", "addExpenseCategory");
            if (label.includes("income") && label.includes("categor")) candidates.push("openAddIncomeCategory", "openIncomeCategoryModal", "addIncomeCategory");
            if (label.includes("cash") && label.includes("account")) candidates.push("openAddCashAccount", "openCashAccountModal", "addCashAccount");
            if (label.includes("bank") && label.includes("account")) candidates.push("openAddBankAccount", "openBankAccountModal", "addBankAccount");
            if (label.includes("investment")) candidates.push("openAddInvestment", "openInvestmentModal", "addInvestment");
            if (label.includes("saving")) candidates.push("openAddSaving", "openSavingsModal", "addSaving", "addSavings");

            for (const name of candidates) {
                if (typeof window[name] === "function") {
                    event.preventDefault();
                    event.stopImmediatePropagation();
                    button.dataset.settingsRepairHandled = "true";
                    window[name]();
                    return;
                }
            }
        }, true);
    }

    if (document.readyState === "loading") {
        document.addEventListener("DOMContentLoaded", initSettingsRepair, { once: true });
    } else {
        initSettingsRepair();
    }
})();
'''

          if 'SETTINGS REPAIR' not in text:
              text += repair

          js.write_text(text)

          css = Path('style.css')
          c = css.read_text()
          css_repair = r'''

/* =========================================================
   TRACKIT SETTINGS TOGGLES — aligned, native-feeling control
   ========================================================= */
.settings-page input[type="checkbox"],
#settingsPage input[type="checkbox"] {
    position: absolute;
    opacity: 0;
    pointer-events: none;
}

#settingsPage .trackit-toggle-row,
#settingsPage .toggle,
#settingsPage .switch,
#settingsPage .setting-row,
#settingsPage .setting-item {
    display: flex;
    align-items: center;
    gap: 12px;
}

#settingsPage input[type="checkbox"] + .slider,
#settingsPage input[type="checkbox"] + .toggle-slider,
#settingsPage input[type="checkbox"] + span,
#settingsPage .switch::after {
    box-sizing: border-box;
}

#settingsPage .slider,
#settingsPage .toggle-slider,
#settingsPage .switch {
    flex: 0 0 auto;
}

/* Generic toggle appearance for common existing markup. */
#settingsPage .toggle,
#settingsPage .switch,
#settingsPage .toggle-control {
    width: 46px;
    height: 28px;
    min-width: 46px;
    border-radius: 999px;
    position: relative;
    cursor: pointer;
}

#settingsPage .toggle::after,
#settingsPage .switch::after,
#settingsPage .toggle-control::after {
    content: "";
    position: absolute;
    width: 22px;
    height: 22px;
    left: 3px;
    top: 3px;
    border-radius: 50%;
    background: #fff;
    box-shadow: 0 1px 4px rgba(0,0,0,.18);
    transition: transform .2s ease;
}

#settingsPage input[type="checkbox"]:checked + .slider::after,
#settingsPage input[type="checkbox"]:checked + .toggle-slider::after,
#settingsPage input[type="checkbox"]:checked ~ .slider::after {
    transform: translateX(18px);
}

@media (max-width: 640px) {
    #settingsPage .trackit-toggle-row,
    #settingsPage .setting-row,
    #settingsPage .setting-item {
        min-height: 48px;
    }
}
'''
          if 'TRACKIT SETTINGS TOGGLES' not in c:
              c += css_repair
          css.write_text(c)
          PY

      - name: Commit and remove repair workflow
        run: |
          rm -f .github/workflows/trackit-settings-repair.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add script.js style.css .github/workflows
          git commit -m "Repair settings controls and toggle layout"
          git push

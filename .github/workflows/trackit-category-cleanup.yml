name: TrackIt Category Cleanup

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Update category defaults and remove category icons
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('script.js')
          text = path.read_text()

          expense_old = '''expenseCategories: [
              "Food",
              "Travel",
              "Shopping",
              "Bills",
              "Education",
              "Health",
              "Entertainment",
              "Other"
          ],'''
          income_old = '''incomeCategories: [
              "Salary",
              "Freelance",
              "Business",
              "Interest",
              "Gift",
              "Other"
          ],'''

          text = text.replace(expense_old, 'expenseCategories: [],')
          text = text.replace(income_old, 'incomeCategories: [],')

          icon_block = '''                        <span class="category-button-icon">
                            ${icon(
                                getCategoryIcon(category),
                                16
                            )}
                        </span>

'''
          text = text.replace(icon_block, '')

          # Remove old built-in categories from existing TrackIt data on first load.
          migration = '''\n    const oldExpenseDefaults = ["Food", "Travel", "Shopping", "Bills", "Education", "Health", "Entertainment", "Other"];
    const oldIncomeDefaults = ["Salary", "Freelance", "Business", "Interest", "Gift", "Other"];

    if (Array.isArray(saved.settings?.expenseCategories) &&
        JSON.stringify(saved.settings.expenseCategories) === JSON.stringify(oldExpenseDefaults)) {
        result.settings.expenseCategories = [];
    }

    if (Array.isArray(saved.settings?.incomeCategories) &&
        JSON.stringify(saved.settings.incomeCategories) === JSON.stringify(oldIncomeDefaults)) {
        result.settings.incomeCategories = [];
    }
'''
          marker = '    return {\n        ...fresh,\n        ...saved,'
          if 'oldExpenseDefaults' not in text and marker in text:
              # Insert migration after the return object is built by converting return to result.
              text = text.replace(marker, '    const result = {\n        ...fresh,\n        ...saved,', 1)
              text = text.replace('    };\n}\n\n\nfunction saveData()', '    };' + migration + '\n    return result;\n}\n\n\nfunction saveData()', 1)

          path.write_text(text)
          PY

      - name: Remove temporary workflows
        run: |
          rm -f .github/workflows/trackit-category-cleanup.yml .github/workflows/trackit-settings-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add script.js .github/workflows
          git commit -m "Remove default categories and category icons"
          git push

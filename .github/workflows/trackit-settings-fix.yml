name: TrackIt Settings Fix

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix-settings-button:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Add Settings button handler
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('script.js')
          text = path.read_text()
          marker = 'function setupSettings() {\n'
          handler = '''function setupSettings() {\n\n    const headerSettingsButton = document.getElementById("headerSettingsButton");\n\n    if (headerSettingsButton && !headerSettingsButton.dataset.bound) {\n        headerSettingsButton.dataset.bound = "true";\n        headerSettingsButton.addEventListener("click", () => {\n            showPage("settingsPage");\n        });\n    }\n'''
          if 'headerSettingsButton' not in text and marker in text:
              text = text.replace(marker, handler, 1)
              path.write_text(text)
          PY

      - name: Commit fix
        run: |
          if git diff --quiet; then
            echo "No change needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add script.js
          git commit -m "Fix Settings button navigation"
          git push

name: TrackIt Input and Swipe Fix

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Patch TrackIt interactions
        run: |
          python - <<'PY'
          from pathlib import Path
          js = Path('script.js')
          text = js.read_text()

          patch = r'''

/* =========================================================
   TRACKIT INPUT + SWIPE FIX
   ========================================================= */
(function () {
    if (window.__trackitInputSwipeFix) return;
    window.__trackitInputSwipeFix = true;

    // Prevent a swipe-to-delete gesture from also triggering the row's
    // normal tap/edit action.
    let swipeTarget = null;
    let swipeStartX = 0;
    let swipeMoved = false;

    document.addEventListener('touchstart', function (event) {
        const row = event.target.closest('[data-transaction-id], .transaction-item, .transaction-row, .transaction-card');
        if (!row) return;
        swipeTarget = row;
        swipeStartX = event.touches[0].clientX;
        swipeMoved = false;
    }, { capture: true, passive: true });

    document.addEventListener('touchmove', function (event) {
        if (!swipeTarget || !event.touches.length) return;
        const dx = event.touches[0].clientX - swipeStartX;
        if (Math.abs(dx) > 12) swipeMoved = true;
    }, { capture: true, passive: true });

    document.addEventListener('click', function (event) {
        if (!swipeTarget || !swipeMoved) return;
        const row = event.target.closest('[data-transaction-id], .transaction-item, .transaction-row, .transaction-card');
        if (row === swipeTarget || (row && swipeTarget.contains(row))) {
            event.preventDefault();
            event.stopImmediatePropagation();
        }
        swipeTarget = null;
        swipeMoved = false;
    }, true);

    document.addEventListener('touchend', function () {
        setTimeout(function () {
            swipeTarget = null;
            swipeMoved = false;
        }, 80);
    }, { capture: true, passive: true });

    // Amount fields: Enter and Tab should never move focus to the next
    // amount field. Let the existing category UI receive the action.
    document.addEventListener('keydown', function (event) {
        if (event.key !== 'Enter' && event.key !== 'Tab') return;

        const input = event.target;
        if (!(input instanceof HTMLInputElement)) return;
        if (input.type !== 'number' && input.inputMode !== 'numeric' && input.inputMode !== 'decimal') return;

        const box = input.closest('.quick-input, .quick-entry, .amount-box, .entry-box, [data-quick-type], [data-type]');
        if (!box) return;

        const value = String(input.value || '').trim();
        if (!value || Number(value) <= 0) return;

        event.preventDefault();
        event.stopImmediatePropagation();

        // Prefer the app's existing category-opening functions.
        const names = Object.keys(window).filter(name => {
            const lower = name.toLowerCase();
            return typeof window[name] === 'function' &&
                   (lower.includes('category') || lower.includes('quick')) &&
                   (lower.includes('open') || lower.includes('show') || lower.includes('select') || lower.includes('transaction'));
        });

        for (const name of names) {
            try {
                if (window[name].length <= 1) {
                    window[name](input);
                    return;
                }
            } catch (_) {}
        }

        // If the existing markup exposes a category trigger, activate it.
        const trigger = box.querySelector(
            '[data-category], [data-category-trigger], .category-trigger, .quick-category, .select-category, button[class*="categor"], [role="button"][class*="categor"]'
        );
        if (trigger) {
            trigger.click();
        }
    }, true);
})();
'''

          if 'TRACKIT INPUT + SWIPE FIX' not in text:
              text += patch
              js.write_text(text)
          PY

      - name: Commit patch and remove workflow
        run: |
          rm -f .github/workflows/trackit-input-swipe-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add script.js .github/workflows
          git commit -m "Fix swipe edit conflict and quick amount keyboard navigation"
          git push
